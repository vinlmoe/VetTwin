name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: vetsim-kit

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vetsim-kit
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p vetsim-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy jsonschema
      - name: Rust == Python (fixture M1 régénérée avec le Python de la CI)
        run: python tests/make_m1_fixture.py && cargo test -p vetsim-core --test check_modules
      - name: CLI Rust == Python (paramètres, M1)
        run: python tests/check_params_cli.py --cmd "target/release/vetsim-cli"
      # Activé à partir de M3 (eval) et M4 (pk) :
      # - run: python tests/conformance.py --cmd "target/release/vetsim-cli"

  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy jsonschema
      - run: python tests/validate_modules.py
      - run: python tests/check_modules.py
