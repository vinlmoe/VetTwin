name: Pages

# Publie l'application web VetTwins (moteur WebAssembly) sur GitHub Pages à chaque fusion dans
# main, après l'autotest bit à bit dans Chrome. Réglage requis une fois : Settings → Pages →
# Build and deployment → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: vetsim-kit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vetsim-kit
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: sh web/build.sh
      - name: Autotest dans le navigateur (bit à bit avec le natif)
        run: |
          python3 -m http.server -d web 8000 &
          sleep 2
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=60000 --dump-dom http://localhost:8000/selftest.html > selftest.html
          grep -o "SELFTEST [0-9]*/[0-9]*" selftest.html
          python3 -c "import re,sys; m=re.search(r'SELFTEST (\d+)/(\d+)', open('selftest.html').read()); sys.exit(0 if m and m.group(1)==m.group(2) else 1)"
      - name: Site statique
        run: |
          mkdir -p ../site/pkg
          # tous les modules JavaScript de l'interface (app.js les importe : un oubli casse le site)
          cp web/index.html web/styles.css web/*.js \
             web/selftest.html web/selftest.json web/modules.json ../site/
          cp web/pkg/vetsim_wasm.js web/pkg/vetsim_wasm_bg.wasm ../site/pkg/
          touch ../site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
