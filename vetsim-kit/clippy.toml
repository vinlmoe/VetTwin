# Déterminisme multiplateforme : fonctions transcendantes via vetsim_core::math (libm).
disallowed-methods = [
  { path = "f64::exp", reason = "utiliser vetsim_core::math::exp (libm, bits identiques partout)" },
  { path = "f64::ln", reason = "utiliser vetsim_core::math::ln" },
  { path = "f64::powf", reason = "utiliser vetsim_core::math::pow" },
  { path = "f64::powi", reason = "utiliser une multiplication ou vetsim_core::math::pow" },
  { path = "f64::tanh", reason = "utiliser vetsim_core::math::tanh" },
  { path = "f64::cos", reason = "utiliser vetsim_core::math::cos" },
  { path = "f64::sin", reason = "utiliser vetsim_core::math::sin" },
  { path = "f64::log10", reason = "utiliser vetsim_core::math" },
  { path = "f64::exp2", reason = "utiliser vetsim_core::math" },
]
