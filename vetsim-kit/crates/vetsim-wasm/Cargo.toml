[package]
name = "vetsim-wasm"
description = "Liaison WebAssembly de vetsim (wasm-bindgen) : même API par messages JSON que vetsim-ffi, pour l'application web VetTwins. Usage pédagogique uniquement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vetsim-api = { path = "../vetsim-api" }
wasm-bindgen = "=0.2.100"

[lints]
workspace = true
